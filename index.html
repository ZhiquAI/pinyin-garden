<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>拼音小花园 · 看图读拼音</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="拼音小花园">
<meta name="theme-color" content="#315c43">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="assets/icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css?v=storybook-pwa-1">
<link rel="stylesheet" href="pinyin-grid.css?v=2">
</head>
<body>
<div class="app">
<header class="header"><a class="brand" href="index.html"><span class="brand-icon" aria-hidden="true">✿</span><span>拼音小花园<small>每天读一点，进步一点点</small></span></a><span class="grade">一年级 · 拼读练习</span></header>
<main>
<section class="intro"><div><p class="eyebrow">看一看 · 拼一拼 · 读一读</p><h1>今天，也来读拼音吧<span>！</span></h1><p class="intro-note">看图认识词语，点一下，就能听见。</p></div><div class="intro-art" aria-hidden="true">🌱</div></section>
<div class="workspace">
<aside class="lesson-panel"><div class="panel-heading"><h2>我的练习</h2><span>19 天</span></div><label class="mobile-select" for="day-select">选择练习日</label><select id="day-select" aria-label="选择练习日"></select><nav id="days" aria-label="按天选择练习"></nav><p class="aside-note">慢慢读，不着急。<br>每一次开口都很棒。</p></aside>
<section class="practice" aria-label="拼读练习">
<div class="practice-top"><div><span id="day-label" class="day-tag"></span><h2 id="lesson-title"></h2></div><span id="position"></span></div>
<div class="progress-track"><div id="progress"></div></div>
<div class="flashcard" id="flashcard">
<button class="picture-button" id="picture-button" aria-label="点击图片朗读当前词语"><img id="picture" width="560" height="380" alt=""><span class="picture-hint">点击图片，听一听 <span aria-hidden="true">♪</span></span></button>
<div class="word-content"><div class="word-marker">先自己拼一拼，再听一听</div><p id="pinyin" class="pinyin" lang="zh-Latn-pinyin"></p><p id="hanzi" class="hanzi"></p><button class="speak-button" id="speak"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4 5 9H2v6h3l6 5V4Zm4 4a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg><span id="speak-label">听一听</span></button><p id="status" role="status" class="status">先自己拼一拼，再听听发音</p></div>
</div>
<div class="controls"><div class="audio-controls"><label for="repeat">重复朗读</label><select id="repeat"><option value="1">1 次</option><option value="3">3 次</option><option value="5">5 次</option><option value="0">一直循环</option></select><label for="speed" class="speed-label">语速</label><select id="speed"><option value="0.8">慢速</option><option value="1" selected>正常</option></select></div><label class="hanzi-toggle"><input type="checkbox" id="show-hanzi" checked>显示汉字</label></div>
<div class="navigation"><button id="previous" class="secondary">← 上一张</button><p>大声读出来，你可以的！</p><button id="next" class="next">下一张 →</button></div>
<section class="word-bank" aria-labelledby="bank-title"><div class="bank-heading"><h3 id="bank-title">今天的词语</h3><span>点选任意词语开始练习</span></div><div id="words" class="word-list"></div></section>
</section></div>
<p class="footer">配图为词义提示图标，抽象词语请结合汉字理解。<span>小提示：← → 切换 · 空格朗读 / 停止</span></p>
</main></div>

<!-- 通关小红花结算弹窗 -->
<div id="completion-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-card">
    <div class="modal-confetti" aria-hidden="true">🎉 🌸 ✨ 🌸 🎉</div>
    <div class="modal-flower" aria-hidden="true">💮</div>
    <h3 id="modal-title">太棒啦！通关啦！</h3>
    <p id="modal-desc" class="modal-desc">你已经读完了今天所有的词语，送你一朵小红花！</p>
    <div class="modal-actions">
      <button id="modal-replay" class="secondary">再练一遍</button>
      <button id="modal-next-day" class="next">开始下一天 →</button>
    </div>
  </div>
</div>
<script src="data.js"></script><script src="pinyin-grid.js?v=1"></script><script src="app.js?v=storybook-20261023"></script>
</body></html>
